name: Daily Moving Average Bounce Scan

# Runs on weekdays a little after the US market close.
# NOTE (DST caveat): cron times below are in UTC and GitHub Actions cron
# does NOT shift with US Daylight Saving Time. "30 21 * * 1-5" is 21:30 UTC,
# which is 4:30pm ET during Eastern Daylight Time (roughly March-November)
# but 5:30pm ET during Eastern Standard Time (roughly November-March).
# This is a known limitation of GitHub Actions scheduled workflows -- if you
# want it to fire at a fixed local time year-round, you would need two cron
# lines (one for each DST period) or a small script that checks the time.
# For this tool, being an hour off twice a year is harmless.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

# Needed so the job can commit the data/alert_log.json dedup log
# back to the repo -- without this the log is lost when the runner shuts
# down and the same bounce would re-alert every day.
permissions:
  contents: write

# Never let two scans overlap and race on the alert log.
concurrency:
  group: alert-log
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Needed by the Early Runner scanner (whole-market data). Harmless if unset:
          # that scanner then reports "not configured" and the others still run.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python runner.py --lane daily

      - name: Save alert log
        run: |
          if git diff --quiet -- data/alert_log.json; then
            echo "No new alerts; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alert_log.json
          git commit -m "Update alert log [skip ci]"
          # Pick up any edits Alex made while the scan was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
