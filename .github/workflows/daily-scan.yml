name: Daily Post-Earnings 200 EMA Scan

# Runs on weekdays a little after the US market close.
# NOTE (DST caveat): cron times below are in UTC and GitHub Actions cron
# does NOT shift with US Daylight Saving Time. "30 21 * * 1-5" is 21:30 UTC,
# which is 4:30pm ET during Eastern Daylight Time (roughly March-November)
# but 5:30pm ET during Eastern Standard Time (roughly November-March).
# This is a known limitation of GitHub Actions scheduled workflows -- if you
# want it to fire at a fixed local time year-round, you would need two cron
# lines (one for each DST period) or a small script that checks the time.
# For this tool, being an hour off twice a year is harmless.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python runner.py
